services:
  # Backend Web Service
  - type: web
    name: agentvoxa-backend
    env: python
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn main:app --host 0.0.0.0 --port $PORT
    disk:
      name: uploads
      mountPath: /opt/render/project/src/backend/uploads
      sizeGB: 1
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: agentvoxa-db
          property: connectionString
      - key: FRONTEND_URL
        value: https://agentvoxa-frontend.onrender.com
      - key: GEMINI_API_KEY
        sync: false
      - key: ELEVENLABS_API_KEY
        sync: false
      - key: ELEVENLABS_VOICE_ID
        sync: false
      - key: VAPI_API_KEY
        sync: false
      - key: QDRANT_URL
        sync: false
      - key: QDRANT_API_KEY
        sync: false
      - key: SECRET_KEY
        sync: false

  # Frontend Web Service
  - type: web
    name: agentvoxa-frontend
    env: node
    rootDir: frontend
    buildCommand: npm install && npm run build
    startCommand: npm start
    envVars:
      - key: NEXT_PUBLIC_BACKEND_URL
        fromService:
          type: web
          name: agentvoxa-backend
          envVarKey: RENDER_EXTERNAL_URL

databases:
  # Managed PostgreSQL Database
  - name: agentvoxa-db
    databaseName: agentvoxa
    user: agentvoxa_user
